# Ограничение журнала systemd для сервера с диском 9.4 ГБ и 1 ГБ RAM.
# По умолчанию journald занимает до 10% файловой системы (~940 МБ) — для сервера
# такого размера это много, а для разбора ошибок hopbeer хватает 200 МБ.
#
# Установка:
#   sudo install -m 0644 /opt/hopbeer/deploy/journald-hopbeer.conf \
#       /etc/systemd/journald.conf.d/50-hopbeer.conf
#   sudo systemctl restart systemd-journald
#   sudo journalctl --vacuum-size=200M
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
MaxRetentionSec=2week
