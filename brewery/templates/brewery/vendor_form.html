{% extends 'brewery/base.html' %}

{% block title %}Производитель — форма{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Изменить{% else %}Добавить{% endif %} производителя</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
<p><a href="{% url 'vendor_list' %}">Назад</a></p>
{% endblock %}
