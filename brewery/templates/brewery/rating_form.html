{% extends 'brewery/base.html' %}

{% block title %}Оценка — форма{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Изменить{% else %}Добавить{% endif %} оценку</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
