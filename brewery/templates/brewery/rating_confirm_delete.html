{% extends 'brewery/base.html' %}

{% block title %}Удаление оценки{% endblock %}

{% block content %}
<h1>Удалить оценку «{{ rating.beer }} — {{ rating.score }}/10»?</h1>
<p>Это действие нельзя отменить.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>
<p><a href="{% url 'rating_list' %}">Отмена</a></p>
{% endblock %}
