{% extends 'brewery/base.html' %}

{% block title %}Удаление пива{% endblock %}

{% block content %}
<h1>Удалить «{{ beer.name }}»?</h1>
<p>Это действие нельзя отменить.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>
<p><a href="{% url 'beer_list' %}">Отмена</a></p>
{% endblock %}
